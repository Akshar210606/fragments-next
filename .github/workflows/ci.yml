name: CI

# Carries over the v1 rule you already pitch in your outreach:
# nothing ships unless lint, types and tests all pass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fragments
          POSTGRES_PASSWORD: fragments
          POSTGRES_DB: fragments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fragments:fragments@localhost:5432/fragments_test
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Only Chromium. Three engines would triple the install time to re-prove
      # the same application logic; cross-browser rendering is not what these
      # tests are about.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The integration suite runs against the production build, which is the
      # artefact that would actually ship. Port 3000 is freed afterwards so the
      # browser suite can start its own server without racing this one.
      - name: Start production server and run integration tests
        run: |
          npm start &
          npx wait-on http://localhost:3000/api/health -t 30000
          npm test
          npx --yes kill-port 3000

      # The browser suite runs against a dev server instead. Sign-in goes
      # through /api/auth/dev-token, which is disabled in production by design,
      # so pointing Playwright at `npm start` fails every authenticated test
      # with a 404 unrelated to the code under test. Playwright starts the dev
      # server itself via the webServer block in playwright.config.ts.
      - name: Run end-to-end browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
