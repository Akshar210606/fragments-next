name: CI

# Carries over the v1 rule you already pitch in your outreach:
# nothing ships unless lint, types and tests all pass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fragments
          POSTGRES_PASSWORD: fragments
          POSTGRES_DB: fragments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fragments:fragments@localhost:5432/fragments_test
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck

      # Only Chromium. Three engines would triple the install time to re-prove
      # the same application logic; cross-browser rendering is not what these
      # tests are about.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # Order matters here, and not for the obvious reason.
      #
      # The browser suite runs against a DEVELOPMENT server: sign-in goes
      # through /api/auth/dev-token, which returns 404 in production by design,
      # so a production server fails every authenticated test with a 404 that
      # has nothing to do with the code under test.
      #
      # Running it BEFORE the production server exists means there is never a
      # process to hunt down and kill. The earlier version of this file started
      # the production server first and then tried to free the port, which is a
      # step that can quietly fail and leave the wrong server answering. This
      # ordering removes that failure entirely rather than defending against it.
      #
      # Playwright starts and stops its own dev server via the webServer block
      # in playwright.config.ts, so port 3000 is free again afterwards.
      # ---------------------------------------------------------------------
      - name: Run end-to-end browser tests
        run: npm run test:e2e

      # Built after the dev run so the production artefact is clean, and it is
      # this artefact the integration suite then exercises.
      - run: npm run build

      - name: Start production server and run integration tests
        run: |
          npm start &
          npx wait-on http://localhost:3000/api/health -t 30000
          npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
