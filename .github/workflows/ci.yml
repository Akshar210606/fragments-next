name: CI

# Carries over the v1 rule you already pitch in your outreach:
# nothing ships unless lint, types and tests all pass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fragments
          POSTGRES_PASSWORD: fragments
          POSTGRES_DB: fragments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fragments:fragments@localhost:5432/fragments_test
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Only Chromium. Three engines would triple the install time to re-prove
      # the same application logic; cross-browser rendering is not what these
      # tests are about.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # One step, one server. The integration suite and the end-to-end suite
      # both run against the same started process, so there is no second
      # server racing for port 3000 and no reliance on a background process
      # surviving between steps.
      - name: Start server, run integration and end-to-end tests
        run: |
          npm start &
          npx wait-on http://localhost:3000/api/health -t 30000
          npm test
          npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
